# Starting point: review image provenance, resources, and mounts before use.
images:
  - location: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-arm64.img"
    arch: "aarch64"
  - location: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
    arch: "x86_64"
cpus: 6
memory: "12GiB"
disk: "80GiB"
mounts:
  - location: "~"
    writable: false
  - location: "/tmp/aerocel-cases"
    mountPoint: "/srv/aerocel/cases"
    writable: true
containerd:
  system: false
  user: false
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euxo pipefail
      install -d -m 0750 -o "${LIMA_CIDATA_USER}" -g "${LIMA_CIDATA_USER}" /srv/aerocel/cases
message: |
  Solver software is intentionally not auto-installed. Pin and validate the
  distribution required by your project, then record its version in results.
