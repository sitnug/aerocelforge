services:
  orchestrator:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.orchestrator
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - aerocel-runtime:/var/lib/aerocel
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  aerocel-runtime:
