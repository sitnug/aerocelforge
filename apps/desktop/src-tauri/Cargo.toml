[package]
name = "aerocel-forge"
version = "0.1.0"
description = "Aerocel Forge native desktop host"
authors = ["Aerocel Forge contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aerocel_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = "=0.38.3"
tauri = { version = "2.11.5", features = [] }
which = "8.0.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
