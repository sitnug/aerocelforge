[project]
name = "aerocel-scientific-orchestrator"
version = "1.0.0"
description = "Capability-gated scientific job orchestration for Aerocel Forge"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.128,<1",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "ruff>=0.12,<1"
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["UP045"] # Pydantic evaluates PEP 604 strings incompatibly on supported Python 3.9.

[tool.mypy]
python_version = "3.9"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# CI resolves the newest AnyIO supported by its Python runtime. Do not type-check
# dependency internals against this project's lower Python 3.9 target.
module = ["anyio.*"]
follow_imports = "skip"

[tool.setuptools.packages.find]
include = ["aerocel_service*"]

[tool.uvicorn]
factory = false
